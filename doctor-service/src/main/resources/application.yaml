server:
  port: 8083

spring:
  application:
    name: doctor-service

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:7777}/${DOCTOR_DB_NAME:heal_doctor}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:shvetpass}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_SERVER_URL:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
